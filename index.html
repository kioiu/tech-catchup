<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="エンジニア初心者のための、今日見るべきTechニュース。">
  <title>Tech Catchup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand-mark" aria-hidden="true">TC</div>
    <div>
      <p class="eyebrow">DAILY TECH BRIEF</p>
      <h1>Tech Catchup</h1>
      <p class="tagline">エンジニア初心者のための、<br>今日のTechニュース。</p>
    </div>
    <time class="updated" id="updatedAt">読み込み中</time>
  </header>

  <main>
    <section class="today-section" aria-labelledby="todayTitle">
      <div class="section-heading">
        <div><p class="eyebrow accent">START HERE</p><h2 id="todayTitle">今日これだけ</h2></div>
        <span class="section-note">3分でキャッチアップ</span>
      </div>
      <div id="topStories" class="top-stories" aria-live="polite"></div>
    </section>

    <nav class="category-nav" aria-label="カテゴリ" id="categoryNav"></nav>

    <section class="feed-section" aria-labelledby="feedTitle">
      <div class="feed-heading"><h2 id="feedTitle">Latest signal</h2><span id="resultCount"></span></div>
      <div id="newsList" class="news-list" aria-live="polite"></div>
      <div id="emptyState" class="empty-state" hidden>このカテゴリのニュースはありません。</div>
    </section>
  </main>
  <footer><span>Tech Catchup</span><span>Curated for the next step.</span></footer>
  <script src="app.js"></script>
</body>
</html>
